[package]
name = "tablo"
version = "2.2.2"
description = "A tiny floating cat that watches your Claude Code agents"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tablo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps the user's ~/.claude/settings.json key order on merge.
serde_json = { version = "1", features = ["preserve_order"] }
notify = "6"
dirs = "5"
# OpenCode keeps its sessions in SQLite (not JSONL), so it needs a real client.
# `bundled` compiles SQLite in rather than linking the system copy, so the
# Windows/Linux release builds don't depend on a libsqlite3 being present.
rusqlite = { version = "0.32", features = ["bundled"] }
# Tiny synchronous HTTP server for the PreToolUse approval hook (Phase 4).
tiny_http = "0.12"
# OS CSPRNG for the per-run loopback IPC secret (already in the tree via tauri).
getrandom = "0.2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-aptabase = "1"
# The Aptabase plugin spawns its dispatcher with raw `tokio::spawn` from its setup
# hook, so the app must run inside a Tokio runtime (provided in main.rs).
tokio = { version = "1", features = ["rt-multi-thread"] }
